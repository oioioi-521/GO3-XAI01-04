[pytest]
# The Codex Windows sandbox can deny writes to its redirected system Temp.
# Keep pytest's disposable files in this dedicated ignored results directory.
addopts = --basetemp=results/.pytest_tmp
# Review snapshots/dependencies and model outputs are artifacts, not this
# checkout's tests. Preserve pytest's default exclusions as well.
norecursedirs = .* build dist CVS _darcs {arch} *.egg venv node_modules results outputs
