# Formal unit: do not start until the desktop GPU and frozen eval images are available.
method: ig
dataset:
  name: imagenet
  split: eval
model:
  name: resnet50
  weights: default
  num_classes: 1000
  task_type: multiclass
  output_activation: softmax
  checkpoint: null
attribution:
  n_steps: 50
  internal_batch_size: 10
  approximation_method: gausslegendre
metrics:
  names: [efficiency_time_ms, faithfulness_morf_auc_raw]
  deletion_fractions: [0.0, 0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95, 1.0]
runtime:
  device: auto
  seed: 42
  max_images: null
  resume: true
output:
  per_image_csv: results/per_image.csv
  units_csv: results/units.csv
  config_dir: results/configs
  save_maps: true
  maps_dir: results/maps
  save_float_maps: true
  float_maps_dir: results/maps_float
