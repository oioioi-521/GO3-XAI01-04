# Review-only formal eval config. Do not run until the group approves parameters and output location.
method: occlusion
dataset:
  name: imagenet
  split: eval
model:
  name: vgg16
  weights: default
  num_classes: 1000
  task_type: multiclass
  output_activation: softmax
  checkpoint: null
attribution:
  window_height: 32
  window_width: 32
  stride_height: 16
  stride_width: 16
  perturbations_per_eval: 16
metrics:
  names: [efficiency_time_ms, faithfulness_morf_auc_raw]
  deletion_fractions: [0.0, 0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95, 1.0]
runtime:
  device: cuda
  seed: 42
  max_images: null
  warmup_runs: 1
  resume: true
output:
  per_image_csv: results/occlusion_eval/vgg16_imagenet/per_image.csv
  units_csv: results/occlusion_eval/vgg16_imagenet/units.csv
  predictions_csv: results/occlusion_eval/vgg16_imagenet/predictions.csv
  config_dir: results/occlusion_eval/vgg16_imagenet/configs
  run_log: results/occlusion_eval/vgg16_imagenet/run_log.jsonl
  state_dir: results/occlusion_eval/vgg16_imagenet/run_state
  maps_dir: results/occlusion_eval/vgg16_imagenet/maps
  float_maps_dir: results/occlusion_eval/vgg16_imagenet/maps_float
  save_maps: true
  save_float_maps: true
