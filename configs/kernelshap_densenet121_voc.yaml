# Blocked until B provides this VOC20 checkpoint with the agreed class order.
method: kernelshap
dataset: {name: voc, split: debug}
model: {name: densenet121, weights: none, num_classes: 20, checkpoint: models/checkpoints/densenet121_voc20.pt}
attribution: {n_samples: 256, perturbations_per_eval: 16, feature_grid_size: 14, seed: 42, show_progress: false}
metrics: {names: [efficiency_time_ms, faithfulness_morf_auc], deletion_fractions: [0.0, 0.25, 0.5, 0.75, 1.0]}
runtime: {device: auto, seed: 42, max_images: 10, resume: true}
output: {per_image_csv: results/per_image.csv, units_csv: results/units.csv, config_dir: results/configs, run_log: results/run_log.jsonl, maps_dir: results/maps, save_maps: true}
