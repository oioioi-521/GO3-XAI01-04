# Formal unit: VGG-16 uses its last convolution layer (features.28).
method: gradcam
dataset:
  name: imagenet
  split: eval
model:
  name: vgg16
  weights: default
  num_classes: 1000
  checkpoint: null
attribution:
  target_layer: features.28
metrics:
  names: [efficiency_time_ms, faithfulness_morf_auc]
  deletion_fractions: [0.0, 0.25, 0.5, 0.75, 1.0]
runtime:
  device: auto
  seed: 42
  max_images: null
  resume: true
output:
  per_image_csv: results/per_image.csv
  units_csv: results/units.csv
  config_dir: results/configs
