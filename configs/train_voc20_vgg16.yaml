seed: 42
model: {name: vgg16}
data: {train_manifest: data/voc20_multilabel_train.csv, validation_manifest: data/voc20_multilabel_validation.csv}
runtime: {batch_size: 16}
optimizer: {lr: 0.0001}
early_stopping: {patience: 6, min_delta: 0.0}
metrics: {threshold: 0.5}
epochs: 30
output: {checkpoint: models/checkpoints/vgg16_voc20_multilabel.pt, record: results/training/vgg16_voc20_multilabel.json}
