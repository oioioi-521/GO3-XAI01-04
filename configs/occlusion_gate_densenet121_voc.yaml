# Occlusion candidate gate only: 40 frozen debug images, never the 460-image eval.
method: occlusion
dataset:
  name: voc
  split: debug
model:
  name: densenet121
  weights: none
  num_classes: 20
  task_type: multilabel
  output_activation: sigmoid
  checkpoint: models/checkpoints/densenet121_voc20.pt
attribution:
  window_height: 32
  window_width: 32
  stride_height: 16
  stride_width: 16
  perturbations_per_eval: 16
metrics:
  names: [efficiency_time_ms, faithfulness_morf_auc_raw]
  deletion_fractions: [0.0, 0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95, 1.0]
runtime:
  device: cuda
  seed: 42
  max_images: 40
  warmup_runs: 1
  resume: true
output:
  per_image_csv: results/occlusion_gates/debug40/densenet121_voc/per_image.csv
  units_csv: results/occlusion_gates/debug40/densenet121_voc/units.csv
  predictions_csv: results/occlusion_gates/debug40/densenet121_voc/predictions.csv
  config_dir: results/occlusion_gates/debug40/densenet121_voc/configs
  run_log: results/occlusion_gates/debug40/densenet121_voc/run_log.jsonl
  maps_dir: results/occlusion_gates/debug40/densenet121_voc/maps
  float_maps_dir: results/occlusion_gates/debug40/densenet121_voc/maps_float
  save_maps: true
  save_float_maps: true
