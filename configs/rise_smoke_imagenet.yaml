# Offline plumbing check only: random weights and 16 masks are not reportable results.
method: rise
dataset:
  name: imagenet
  split: debug
model:
  name: resnet50
  weights: none
  num_classes: 1000
  checkpoint: null
attribution:
  num_masks: 16
  mask_size: 4
  mask_probability: 0.5
  batch_size: 8
  seed: 42
metrics:
  names: [efficiency_time_ms, faithfulness_morf_auc]
  deletion_fractions: [0.0, 0.5, 1.0]
runtime:
  device: cpu
  seed: 42
  max_images: 1
  resume: true
output:
  per_image_csv: results/smoke/per_image.csv
  units_csv: results/smoke/units.csv
  config_dir: results/smoke/configs
  run_log: results/smoke/run_log.jsonl
